[package]
name = "sigmask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Decode Linux process signal masks (SigPnd, ShdPnd, SigBlk, SigIgn, SigCgt) from /proc/PID/status"
license = "MIT"
repository = "https://github.com/r4um/sigmask"
readme = "README.md"
keywords = ["signal", "linux", "proc", "sigmask", "cli"]
categories = ["command-line-utilities", "os::linux-apis"]
include = ["/src", "/tests", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }

[[bin]]
name = "sigmask"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
strip = true
